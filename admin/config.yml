backend:
  name: git-gateway
  branch: main

# Where uploaded photos are stored in the repo, and the URL prefix used
# when they're referenced from the site.
media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - name: "portfolio"
    label: "Portfolio"
    description: "Add, edit, or remove work shown on the Work page and homepage."
    files:
      - name: "portfolio"
        label: "Portfolio Items"
        file: "content/portfolio.json"
        description: "Every item below shows up on the Work page. Drag to reorder — top item shows first."
        fields:
          - label: "Work"
            name: "items"
            widget: "list"
            summary: "{{title}} — {{category}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Portraits", "Weddings", "Fashion & Beauty", "Corporate Shoot", "Events", "Commercials", "Graphics Design"]
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Short description", name: "description", widget: "text", required: false }
